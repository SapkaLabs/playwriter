<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Connection settings · Playwriter</title>
    <link rel="stylesheet" href="./connection-settings.css" />
  </head>
  <body>
    <main>
      <header>
        <strong>Playwriter</strong>
        <nav aria-label="Settings">
          <a href="./connection-settings.html" aria-current="page">Connection</a>
          <a href="./manage-servers.html">Manage Servers</a>
        </nav>
      </header>
      <h1>Connection</h1>
      <section class="status" aria-label="Current connection">
        <div class="status-top">
          <p class="status-name">
            <span class="dot" aria-hidden="true"></span><span id="state" role="status">Loading…</span>
          </p>
          <button id="disconnect" type="button" hidden>Disconnect</button>
        </div>
        <p id="detail" class="muted"></p>
        <button id="copy-connection" type="button" hidden>Copy CLI command</button>
        <p id="copy-state" role="status"></p>
      </section>
      <fieldset disabled>
        <legend>Choose a route</legend>
        <label class="route">
          <input type="radio" name="route" value="local" aria-labelledby="local" aria-describedby="local-detail" />
          <span
            ><strong id="local">Local</strong
            ><small id="local-detail"
              >Use the relay on this computer to control eligible tabs in this Chrome profile.</small
            ></span
          >
        </label>
        <label class="route">
          <input type="radio" name="route" value="hosted" aria-labelledby="hosted" aria-describedby="hosted-detail" />
          <span
            ><strong id="hosted">playwriter.dev</strong
            ><small id="hosted-detail"
              >Share eligible tabs in this Chrome profile with a remote Playwriter CLI.</small
            ></span
          >
        </label>
        <label class="route">
          <input
            type="radio"
            name="route"
            value="tailcat"
            aria-labelledby="tailcat"
            aria-describedby="tailcat-detail"
          />
          <span
            ><strong id="tailcat">Tailcat</strong
            ><small id="tailcat-detail">Share eligible tabs with a remote Playwriter CLI through Tailcat.</small></span
          >
        </label>
        <label id="server-choice" hidden
          >Tailcat server
          <select id="server"></select
        ></label>
      </fieldset>
      <p id="pending" class="muted" role="status"></p>
      <p id="error" role="alert"></p>
      <button id="connect" type="button" disabled>Connect</button>
      <dialog aria-labelledby="share-title" aria-describedby="share-description">
        <h2 id="share-title">Share browser through playwriter.dev</h2>
        <p id="share-description">
          Anyone with the private CLI command can control eligible tabs in this Chrome profile and open new tabs.
          Sharing continues until you disconnect or close the browser.
        </p>
        <form method="dialog">
          <button value="cancel" autofocus>Cancel</button>
          <button value="share">Share browser</button>
        </form>
      </dialog>
    </main>
    <script type="module" src="./connection-settings-page.ts"></script>
  </body>
</html>
