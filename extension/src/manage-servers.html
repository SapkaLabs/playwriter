<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Manage Servers · Playwriter</title>
    <link rel="stylesheet" href="./connection-settings.css" />
  </head>
  <body>
    <main>
      <header>
        <strong>Playwriter</strong>
        <nav aria-label="Settings">
          <a href="./connection-settings.html">Connection</a>
          <a href="./manage-servers.html" aria-current="page">Manage Servers</a>
        </nav>
      </header>
      <h1>Manage Servers</h1>
      <p class="muted">Changes apply the next time you connect.</p>
      <ul class="server-list" aria-label="Tailcat servers">
        <li>
          <strong>Public Tailcat</strong>
          <small>Built in</small>
        </li>
      </ul>
      <button id="add-server" type="button" disabled>Add server</button>
      <form id="server-form" hidden>
        <fieldset>
          <legend id="form-title">Add server</legend>
          <label>Name <input id="name" type="text" required /></label>
          <label>HTTPS DERP map URL <input id="map-url" type="text" inputmode="url" required /></label>
          <div class="server-actions">
            <button type="submit">Save server</button>
            <button id="cancel-edit" type="button">Cancel</button>
          </div>
        </fieldset>
      </form>
      <p id="validation" role="status"></p>
      <p id="error" role="alert"></p>
      <dialog aria-labelledby="remove-title">
        <h2 id="remove-title">Remove server?</h2>
        <p>Any active connection keeps using this server until you connect again or disconnect.</p>
        <form method="dialog">
          <button value="cancel" autofocus>Cancel</button>
          <button value="remove">Remove server</button>
        </form>
      </dialog>
    </main>
    <script type="module" src="./manage-servers-page.ts"></script>
  </body>
</html>
